[package]
name = "sae"
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
description = "esa semantic search CLI"
license = "MIT"

[features]
test-support = []

[dependencies]
anyhow = "1"
bytemuck = "1"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
tempfile = "3"
jiff = "0.2"
reqwest = { version = "0.13", features = ["json", "blocking"] }
llama-cpp-2 = { path = "vendor/llama-cpp-2", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
sqlite-vec = "=0.1.9"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
unicode-normalization = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
insta = "1"
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# absolute paths
absolute_paths = "deny"
# idiomatic iterators
cast_possible_truncation = "deny"
redundant_closure_for_method_calls = "deny"
filter_map_next = "deny"
flat_map_option = "deny"
manual_filter_map = "deny"
manual_find_map = "deny"
# imports
wildcard_imports = "deny"
enum_glob_use = "deny"
# strings
str_to_string = "deny"
# arguments
needless_pass_by_value = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
