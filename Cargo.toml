[package]
name = "sae"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "esa semantic search CLI"
license = "MIT"

[features]
test-support = ["rurico/test-support"]

[dependencies]
amici = { git = "https://github.com/thkt/amici", rev = "9be815a" }
bytemuck = "1"
clap = { version = "4.6", features = ["derive"] }
jiff = "0.2"
reqwest = { version = "0.13", features = ["json"] }
rurico = { git = "https://github.com/thkt/rurico", rev = "bd637c2" }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
rurico = { git = "https://github.com/thkt/rurico", rev = "bd637c2", features = ["test-support"] }
tempfile = "3"
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# absolute paths
absolute_paths = "deny"
# idiomatic iterators
cast_possible_truncation = "deny"
redundant_closure_for_method_calls = "deny"
filter_map_next = "deny"
flat_map_option = "deny"
manual_filter_map = "deny"
manual_find_map = "deny"
# imports
wildcard_imports = "deny"
enum_glob_use = "deny"
# strings
str_to_string = "deny"
# arguments
needless_pass_by_value = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
