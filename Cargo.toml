[package]
name = "sae"
version = "0.1.0"
edition = "2024"
description = "esa semantic search CLI"
license = "MIT"

[features]
test-support = ["rurico/test-support"]

[dependencies]
amici = { git = "https://github.com/thkt/amici", rev = "d0460c6" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
rurico = { git = "https://github.com/thkt/rurico", rev = "3cc9cb0" }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rurico = { git = "https://github.com/thkt/rurico", rev = "3cc9cb0", features = ["test-support"] }
serial_test = "3"
tempfile = "3"
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# フルパス使用検出
absolute_paths = "deny"
# Rustイディオム (RUST.md idioms table)
cast_possible_truncation = "deny"
redundant_closure_for_method_calls = "deny"
filter_map_next = "deny"
flat_map_option = "deny"
manual_filter_map = "deny"
manual_find_map = "deny"
# インポート
wildcard_imports = "deny"
enum_glob_use = "deny"
# 文字列
str_to_string = "deny"
# 引数
needless_pass_by_value = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
