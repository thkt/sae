[package]
name = "sae"
version = "0.1.0"
edition = "2024"
description = "esa semantic search CLI"

[features]
test-support = ["rurico/test-support"]

[dependencies]
amici = { git = "https://github.com/thkt/amici", rev = "814a852" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
rurico = { git = "https://github.com/thkt/rurico", rev = "03275f7" }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rurico = { git = "https://github.com/thkt/rurico", rev = "03275f7", features = ["test-support"] }
serial_test = "3"
tempfile = "3"
wiremock = "0.6"

[patch."https://github.com/thkt/amici"]
amici = { path = "../amici" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
