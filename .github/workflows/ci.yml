name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check
        run: cargo check

      - name: Install nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --profile ci

      - name: Test (test-support feature)
        run: cargo nextest run --profile ci --features test-support
        # Runs T-CI006..T-CI008 hidden-seam integration tests that pin the
        # UNKNOWN (104) and INTERNAL (70) envelopes at the process boundary
        # (#127 OPS-005 / CHX-001). The default `cargo nextest` invocation
        # builds without `--features test-support`, so these tests are
        # skipped there.

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

  coverage:
    # Diff coverage gate: fail when coverage of the lines this PR adds or
    # changes drops below the threshold, so new uncovered code (pub fn /
    # branches) cannot merge untested. No overall-percent floor (which would
    # flag existing unreachable code); no base-vs-PR double measurement.
    # Rationale: ported from yomu (Issue #223), THRESHOLDS.md "Coverage".
    # Run all native contracts on a CPU host; hosted macOS only exposes a
    # virtual Metal device. The macOS test job retains Metal build checks.
    # --features test-support mirrors the test job (hidden-seam tests) so
    # coverage matches what is tested.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov

      - name: Prepare pinned public model for native coverage
        env:
          SAE_MODEL_DIR: ${{ runner.temp }}/sae-coverage-model
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov run --no-report --features test-support --example prepare_model

      - name: Generate lcov coverage including real native contracts
        env:
          SAE_MODEL_DIR: ${{ runner.temp }}/sae-coverage-model
        run: cargo llvm-cov --no-clean --features test-support --lcov --output-path lcov.info -- --include-ignored --test-threads=1

      - name: Upload coverage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Diff coverage gate (changed lines >= 95%)
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          # diff-cover is a Python tool; isolate it in a venv to avoid PEP 668
          # (externally-managed environments) regardless of the runner's Python.
          python3 -m venv /tmp/diff-cover-venv
          /tmp/diff-cover-venv/bin/pip install --quiet diff-cover
          /tmp/diff-cover-venv/bin/diff-cover lcov.info \
            --compare-branch=origin/main \
            --fail-under=95

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Deny check
        run: cargo deny check

      - name: Audit
        run: cargo audit
